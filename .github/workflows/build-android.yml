name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
      - name: Give APK a versioned filename
        id: package
        shell: bash
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/rabbit-sleep-guard-v${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: rabbit-sleep-guard-v${{ steps.package.outputs.version }}
          path: dist/rabbit-sleep-guard-v${{ steps.package.outputs.version }}.apk
          if-no-files-found: error
